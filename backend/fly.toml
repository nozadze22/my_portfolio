# Fly.io — NestJS portfolio API
# Create app once: fly apps create portfolio  (name must be globally unique)
# Docs: see FLY.md in this folder

app = 'giorgi-portfolio-api'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = 'sh prisma/fly-migrate-deploy.sh'